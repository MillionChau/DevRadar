# ==========================================
# DevRadar Frontend Nginx Configuration
# Reverse Proxy & Single Page Application (SPA)
# ==========================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Tối ưu hóa hiệu năng truyền tải file
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip nén dữ liệu cho trang tải nhanh
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Health check endpoint cho Docker / Kubernetes
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Cache tĩnh cho bundle assets (JS, CSS, Images, Fonts)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Proxy ảnh media từ MinIO S3 Object Storage nội bộ
    location ~ ^/(devradar-avatars|devradar-covers|devradar-models)/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    # Tích hợp định tuyến API Gateway & SignalR Realtime Hubs
    # Chuyển tiếp toàn bộ API microservices vào gateway-api:8080 trong Docker Network
    location ~ ^/(identity|community|notification|crawler|quality|api|hubs)/ {
        proxy_pass http://gateway-api:8080;
        proxy_http_version 1.1;

        # WebSocket support cho SignalR realtime
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeout dài cho WebSocket / Streaming API
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Hỗ trợ upload ảnh/file dung lượng tới 50MB
        client_max_body_size 50M;
    }

    # Single Page Application (SPA) Fallback: Các route React Router trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
