name: devradar

services:
  # ==================== Hạ tầng (Infrastructures) ====================

  identity-db:
    image: postgres:16-alpine
    container_name: devradar-identity-db
    restart: always
    environment:
      POSTGRES_DB: devradar-identity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - identity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devradar-identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  community-db:
    image: postgres:16-alpine
    container_name: devradar-community-db
    restart: always
    environment:
      POSTGRES_DB: community-postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - community_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d community-postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-db:
    image: postgres:16-alpine
    container_name: devradar-notification-db
    restart: always
    environment:
      POSTGRES_DB: notification-postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - notification_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification-postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  crawler-mongo:
    image: mongo:7
    container_name: devradar-crawler-mongo
    restart: always
    volumes:
      - crawler_mongodata:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  quality-mongo:
    image: mongo:7
    container_name: devradar-quality-mongo
    restart: always
    volumes:
      - quality_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: devradar-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ==================== Application Services ====================

  identity-api:
    build:
      context: ./services/IdentityService
      dockerfile: Dockerfile
    container_name: devradar-identity-api
    restart: always
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=identity-db;Port=5432;Database=devradar-identity;User Id=postgres;Password=${POSTGRES_PASSWORD:-123456}
      - JwtSettings__Secret=DevRadarSecretKey_SuperSecureKeyForJWTTokenGeneration_2026_SecureApp
      - JwtSettings__Issuer=DevRadarIdentityService
      - JwtSettings__Audience=DevRadarClients
    depends_on:
      identity-db:
        condition: service_healthy

  community-api:
    build:
      context: ./services/CommunityService
      dockerfile: Dockerfile
    container_name: devradar-community-api
    restart: always
    ports:
      - "5145:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=community-db;Port=5432;Database=community-postgres;User Id=postgres;Password=${POSTGRES_PASSWORD:-123456}
      - JwtSettings__Secret=DevRadarSecretKey_SuperSecureKeyForJWTTokenGeneration_2026_SecureApp
      - JwtSettings__Issuer=DevRadarIdentityService
      - JwtSettings__Audience=DevRadarClients
      - NotificationService__BaseUrl=http://notification-api:8080
      - NotificationService__ApiKey=DevRadar_Internal_Community_Notification_2026
    depends_on:
      community-db:
        condition: service_healthy
      notification-api:
        condition: service_started

  notification-api:
    build:
      context: ./services/NotificationService
      dockerfile: Dockerfile
    container_name: devradar-notification-api
    restart: always
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=notification-db;Port=5432;Database=notification-postgres;User Id=postgres;Password=${POSTGRES_PASSWORD:-123456}
      - JwtSettings__Secret=DevRadarSecretKey_SuperSecureKeyForJWTTokenGeneration_2026_SecureApp
      - JwtSettings__Issuer=DevRadarIdentityService
      - JwtSettings__Audience=DevRadarClients
      - ApiKey__Key=DevRadar_Internal_Community_Notification_2026
    depends_on:
      notification-db:
        condition: service_healthy

  crawler-api:
    build:
      context: ./services/CrawlerGithubService
      dockerfile: Dockerfile
    container_name: devradar-crawler-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://crawler-mongo:27017/github-crawler
      - MONGODB_DB_NAME=github-crawler
      - GITHUB_ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN:-}
    depends_on:
      crawler-mongo:
        condition: service_healthy

  quality-api:
    build:
      context: ./services/QualityService
      dockerfile: Dockerfile
    container_name: devradar-quality-api
    restart: always
    ports:
      - "8001:8001"
    environment:
      - MONGODB_URL=mongodb://quality-mongo:27017/quality
      - MONGODB_DB_NAME=quality
      - ELASTICSEARCH_ENABLED=true
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      quality-mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # ==================== API Gateway ====================

  gateway-api:
    build:
      context: ./services/GatewayService
      dockerfile: Dockerfile
    container_name: devradar-gateway-api
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # Ghi đè địa chỉ cluster trong yarp.json khi chạy Docker
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity-api:8080
      - ReverseProxy__Clusters__community-cluster__Destinations__destination1__Address=http://community-api:8080
      - ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address=http://notification-api:8080
      - ReverseProxy__Clusters__crawler-cluster__Destinations__destination1__Address=http://crawler-api:8000
      - ReverseProxy__Clusters__quality-cluster__Destinations__destination1__Address=http://quality-api:8001
    depends_on:
      - identity-api
      - community-api
      - notification-api
      - crawler-api
      - quality-api

volumes:
  identity_pgdata:
    driver: local
  community_pgdata:
    driver: local
  notification_pgdata:
    driver: local
  crawler_mongodata:
    driver: local
  quality_mongodata:
    driver: local
  esdata:
    driver: local
