version: '3.8'

services:
  # ==========================================
  # Infrastructure Services
  # ==========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: devradar-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xm512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - devradar-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Microservices
  # ==========================================

  # 1. Quality Service (Python / FastAPI)
  quality-service:
    build:
      context: ./services/QualityService
      dockerfile: Dockerfile
    container_name: devradar-quality-service
    ports:
      - "8001:8001"
    environment:
      - APP_NAME=QualityService
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8001
      - ELASTICSEARCH_ENABLED=true
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - devradar-network
    restart: unless-stopped

  # 2. Crawler Github Service (Python)
  crawler-service:
    build:
      context: ./services/CrawlerGithubService
      dockerfile: Dockerfile
    container_name: devradar-crawler-service
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
    networks:
      - devradar-network
    restart: unless-stopped

  # 3. Community Service (.NET)
  community-service:
    build:
      context: ./services/CommunityService
      dockerfile: Dockerfile
    container_name: devradar-community-service
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - devradar-network
    restart: unless-stopped

  # 4. Identity Service (.NET)
  identity-service:
    build:
      context: ./services/IdentityService
      dockerfile: Dockerfile
    container_name: devradar-identity-service
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - devradar-network
    restart: unless-stopped

  # 5. Notification Service (.NET)
  notification-service:
    build:
      context: ./services/NotificationService
      dockerfile: Dockerfile
    container_name: devradar-notification-service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - devradar-network
    restart: unless-stopped

# ==========================================
# Networks & Volumes
# ==========================================
networks:
  devradar-network:
    driver: bridge

volumes:
  esdata:
    driver: local
